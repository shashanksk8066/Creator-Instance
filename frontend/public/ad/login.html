<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Togalu Gombe - Admin Login</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/pages.css">

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="glass-glow-bg glow-1"></div>
    <div class="glass-glow-bg glow-2"></div>

    <div class="login-container">
        <div class="glass-card login-card">
            <div class="login-logo">🎭</div>
            <h1 class="brand-name" style="font-size: 26px; margin-bottom: 8px;">Togalu Gombe</h1>
            <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 30px;">
                Enter admin credentials to access the monitoring dashboard.
            </p>

            <div class="login-error" id="errorBox"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Admin Email</label>
                    <input class="form-input" type="email" id="email" required placeholder="admin@domain.com">
                </div>
                
                <div class="form-group" style="margin-bottom: 30px;">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" type="password" id="password" required placeholder="••••••••">
                </div>

                <button class="btn-primary" type="submit">Access Dashboard</button>
            </form>
        </div>
    </div>

    <!-- Core Firebase App Logic -->
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
