<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Togalu Gombe - Devices Directory</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/pages.css">

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="glass-glow-bg glow-1"></div>
    <div class="glass-glow-bg glow-2"></div>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-icon">🎭</span>
                <span class="brand-name">Togalu Gombe</span>
            </div>
            
            <nav class="nav-menu">
                <li class="nav-item"><a href="index.html"><span>🏠</span> Dashboard</a></li>
                <li class="nav-item"><a href="users.html"><span>👥</span> Devices Directory</a></li>
                <li class="nav-item"><a href="analytics.html"><span>📊</span> Global Analytics</a></li>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout" id="btnLogout">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content-viewport">
            <header class="content-header">
                <div>
                    <h1 class="page-title">Devices Directory</h1>
                    <p class="page-subtitle">Inspect registered devices, emails, and sync frequencies.</p>
                </div>
            </header>

            <!-- Table of users -->
            <section class="glass-card">
                <div class="table-container">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>User Account (Email)</th>
                                <th>Hardware model</th>
                                <th>Device ID</th>
                                <th>Synchronization Telemetry</th>
                                <th>Inspection Details</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr>
                                <td colspan="5" class="loading-indicator">
                                    <div class="spinner"></div>Loading directory catalog...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Core App JS -->
    <script src="js/app.js"></script>
    <script src="js/users.js"></script>
</body>
</html>
